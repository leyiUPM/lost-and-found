<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost and Found</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Lost and Found</h1><p>Found something on campus? Add it here so its owner knows where to collect it.</p></header>
    <form id="item-form">
      <label for="item-name">Item</label>
      <input id="item-name" name="name" maxlength="100" placeholder="Blue water bottle" required>
      <label for="item-location">Where to collect</label>
      <input id="item-location" name="location" maxlength="120" placeholder="Library reception" required>
      <button type="submit">Add found item</button>
    </form>
    <p id="status" role="status" aria-live="polite">Loading items...</p>
    <section aria-labelledby="items-heading">
      <div class="section-heading"><h2 id="items-heading">Found on campus</h2><button id="refresh" class="secondary" type="button">Refresh</button></div>
      <ul id="items"></ul>
    </section>
  </main>
</body>
</html>
