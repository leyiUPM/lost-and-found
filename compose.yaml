services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: campus_return
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_return"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    ports: ["127.0.0.1:8081:8080"]
    environment:
      DB_URL: postgres://campus_user:${POSTGRES_PASSWORD}@db:5432/campus_return
      DB_SSL: "false"
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    ports: ["127.0.0.1:3000:8080"]
volumes:
  dbdata:
